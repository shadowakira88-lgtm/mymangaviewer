name: Build debug APK
on:
  push:
    branches: ['**']
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mymangaviewer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish APK as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/*.apk ElenaManga.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest ElenaManga.apk \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "ElenaManga latest build" \
            --notes "Built from branch ${{ github.ref_name }} (${{ github.sha }})"
