name: Build debug APK
on:
  push:
    branches: ['**']
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mymangaviewer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish APK as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la app/build/outputs/apk/debug/
          DIR=app/build/outputs/apk/debug
          ARM=$(ls $DIR/*arm64-v8a*.apk 2>/dev/null | head -1)
          UNI=$(ls $DIR/*universal*.apk 2>/dev/null | head -1)
          ANY=$(ls $DIR/*.apk | head -1)
          [ -z "$ARM" ] && ARM="${UNI:-$ANY}"
          cp "$ARM" ElenaManga.apk
          ASSETS="ElenaManga.apk"
          if [ -n "$UNI" ] && [ "$UNI" != "$ARM" ]; then
            cp "$UNI" ElenaManga-universal.apk
            ASSETS="$ASSETS ElenaManga-universal.apk"
          fi
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest $ASSETS \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "ElenaManga latest build" \
            --notes "Built from branch ${{ github.ref_name }} (${{ github.sha }}). ElenaManga.apk is for 64-bit ARM phones (most phones); use ElenaManga-universal.apk if it does not install."
